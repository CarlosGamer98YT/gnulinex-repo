name: Desplegar a GitHub Pages (Soporte LFS)

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'hold_packages.txt'
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefactos a la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Actualizar Repositorio APT (Debian)

on:
  push:
    branches:
      - main
    paths:
      - '**.deb'
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: "repo-updater"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container: debian:forky
    permissions:
      contents: write
      packages: write

    steps:
      - name: Instalar dependencias en Debian
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git dpkg-dev apt-utils gnupg ca-certificates curl python3 python3-apt

          # Instalar GitHub CLI (gh) directamente desde binario oficial (sin repositorios lentos)
          GH_VER=$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/' || echo '2.53.0')
          [ -z "$GH_VER" ] && GH_VER='2.53.0'
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VER}/gh_${GH_VER}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin --strip-components=2 "gh_${GH_VER}_linux_amd64/bin/gh"

      - name: Configurar Git
        run: git config --global --add safe.directory '*'

      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Sincronizar paquetes desde Debian Forky
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GGITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/sync_repo.py
          ./.github/scripts/sync_repo.py

      - name: Generar índices APT y Packages.gz
        if: env.UPDATED == 'true' || github.event_name != 'schedule'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GH_TOKEN: ${{ secrets.GGITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Asegurar que el release para paquetes grandes existe
          gh release view paquetes-grandes >/dev/null 2>&1 || gh release create paquetes-grandes \
            --title "Paquetes Grandes del Repositorio" \
            --notes "Paquetes grandes que no se almacenan en Git." || true

          find . -maxdepth 10 -type f -name "*.deb" -exec dirname {} + | sort -u | while read dir; do
            echo "Generando índices para: $dir"
            cd "$dir"

            echo 'APT::FTPArchive::Release::Origin "GnuLinex";' > apt-release.conf
            echo 'APT::FTPArchive::Release::Label "GnuLinex Repository";' >> apt-release.conf
            echo 'APT::FTPArchive::Release::Suite "stable";' >> apt-release.conf
            echo 'APT::FTPArchive::Release::Codename "forky";' >> apt-release.conf
            echo 'APT::FTPArchive::Release::Architectures "amd64 all";' >> apt-release.conf
            echo 'APT::FTPArchive::Release::Components "main";' >> apt-release.conf

            rm -f Packages Packages.gz Release Release.gpg InRelease

            # 1. Generar Packages con los archivos físicos locales
            apt-ftparchive packages . > Packages

            # 2. Añadir stanzas de paquetes grandes si existen
            if [ -f extra_packages.stanzas ]; then
              cat extra_packages.stanzas >> Packages
            fi

            # 3. Comprimir el índice modificado
            gzip -9c Packages > Packages.gz

            # 4. Generar el Release
            apt-ftparchive -c apt-release.conf release . > Release

            # 5. Firmar con GPG si las credenciales están configuradas
            if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_KEY_ID" ]; then
              echo "$GPG_PRIVATE_KEY" | gpg --batch --import
              gpg --batch --yes --local-user "$GPG_KEY_ID" -abs -o Release.gpg Release
              gpg --batch --yes --local-user "$GPG_KEY_ID" --clearsign -o InRelease Release
            fi

            # 6. Generar index.html simple del directorio de forma instantánea
            {
              echo "<html><body><h1>Indice de $dir</h1><pre>"
              for f in *.deb; do
                [ -f "$f" ] && echo "<a href=\"$f\">$f</a>"
              done
              echo "</pre></body></html>"
            } > index.html

            rm -f apt-release.conf
            cd - > /dev/null
          done

          # Actualizar fecha en el index.html raíz si existe
          if [ -f "$GITHUB_WORKSPACE/index.html" ]; then
            sed -i "s|<p>Actualizado el: .*</p>|<p>Actualizado el: $(date -u)</p>|" "$GITHUB_WORKSPACE/index.html"
          fi

      - name: Guardar y subir cambios
        if: env.UPDATED == 'true' || github.event_name != 'schedule'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git lfs uninstall || true
          rm -f .gitattributes

          git add --all

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-update: Paquetes e indices (Archivos grandes en Releases)"
            git push
          else
            echo "Nada que subir."
          fi